[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-tools"
version = "0.4.0"
description = "Automation tools with Multi-AI and DOCX/PDF generation support"
authors = [{ name = "Your Name" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "google-generativeai>=0.8.0",
    "openai>=1.0.0",
    "reportlab>=4.0.0",
    "python-dotenv>=1.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "docx2pdf>=0.1.8",
]

[project.scripts]
gemini-pdf = "gemini_tools.cli:main"
gemini-read-pdf = "gemini_tools.pdf_reader:main"
