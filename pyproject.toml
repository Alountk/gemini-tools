[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-tools"
version = "0.1.0"
description = "Herramientas de automatización usando la API de Gemini"
authors = [{ name = "Tu Nombre" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "google-generativeai>=0.8.0",
    "reportlab>=4.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
gemini-pdf = "gemini_tools.cli:main"